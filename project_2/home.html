<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Media - Home</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}

/* HEADER */
.header{
    background:#007bff;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{ margin:0; }

/* LAYOUT */
.container{
    display:flex;
    margin:20px;
}

/* PROFILE */
.profile{
    width:25%;
    background:white;
    padding:15px;
    border-radius:8px;
    margin-right:20px;
    cursor:pointer;
}

.profile img{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
}

.profile h3{ margin:10px 0 5px; }

.profile small{
    color:#007bff;
    cursor:pointer;
}

/* FEED */
.feed{ width:75%; }

/* POST BOX */
.post-box{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

.post-box textarea{
    width:100%;
    height:60px;
    padding:10px;
}

.post-box button{
    margin-top:10px;
    background:#007bff;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
}

/* POST */
.post{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:15px;
}

.post .top{
    display:flex;
    justify-content:space-between;
}

.post button{
    border:none;
    background:none;
    color:#007bff;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h2 id="headerUser"></h2>
    <button onclick="logout()">Logout</button>
</div>

<div class="container">

    <!-- PROFILE -->
    <div class="profile" onclick="openProfile()">
        <img id="profileImg" src="">
        <h3 id="profileName"></h3>
        <p>Followers: <span id="followers">0</span></p>
        <p>Following: <span id="following">0</span></p>
        <small id="imgText"></small>
        <input type="file" id="imgInput" hidden onchange="changeImage(event)">
    </div>

    <!-- FEED -->
    <div class="feed">

        <div class="post-box">
            <textarea id="postText" placeholder="What's on your mind?"></textarea>
            <button onclick="createPost()">Post</button>
        </div>

        <div id="posts"></div>

    </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
if (!user) window.location.href = "index.html";
document.getElementById("headerUser").innerText = user.username;
document.getElementById("profileName").innerText = user.username;


/* PROFILE IMAGE LOGIC */
const profileImg = document.getElementById("profileImg");
const imgText = document.getElementById("imgText");

if(profileImg.src === ""){
    imgText.innerText = "Add Image";
}

function openProfile(){
    document.getElementById("imgInput").click();
}

function changeImage(e){
    const file = e.target.files[0];
    profileImg.src = URL.createObjectURL(file);
    imgText.innerText = "Change Image";
}

/* FOLLOW LOGIC */
let followers = 0;
function follow(btn){
    if(btn.innerText === "Follow"){
        btn.innerText = "Following";
        followers++;
        document.getElementById("followers").innerText = followers;
    }
}



// ---------- LOGOUT ----------
function logout(){
  localStorage.removeItem("user");
  window.location.href = "index.html";
}





</script>
<script>
// ---------- CREATE POST ----------
function createPost(){
  const postText = document.getElementById("postText");
  const posts = document.getElementById("posts");
  const text = postText.value;

  if(text === "") return;

  const user = JSON.parse(localStorage.getItem("user"));

  const post = document.createElement("div");
  post.className = "post";

  post.innerHTML = `
    <div class="top">
      <b>${user.username}</b>
      <button onclick="follow(this)">Follow</button>
    </div>

    <p>${text}</p>

    <button onclick="likePost(this)">
      ❤️ <span class="like-count">0</span>
    </button>

    <button onclick="openComment(this)">💬 Comment</button>

    <div class="comment-box" style="display:none; margin-top:8px;">
      <input type="text" placeholder="Write a comment..." style="width:70%">
      <button onclick="sendComment(this)">Send</button>
    </div>

    <div class="comments"></div>
  `;

  posts.prepend(post);
  postText.value = "";
}

// ---------- LIKE ----------
function likePost(btn){
  const span = btn.querySelector(".like-count");
  span.innerText = parseInt(span.innerText) + 1;
}

// ---------- COMMENT ----------
function openComment(btn){
  const post = btn.parentElement;
  post.querySelector(".comment-box").style.display = "block";
}

function sendComment(btn){
  const box = btn.parentElement;
  const input = box.querySelector("input");
  const text = input.value;

  if(text === "") return;

  const comments = box.parentElement.querySelector(".comments");
  const div = document.createElement("div");
  div.innerHTML = `<small>💬 ${text}</small>`;

  comments.appendChild(div);
  input.value = "";
}
</script>




</body>
</html>
